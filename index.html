<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123050"><link rel="manifest" href="manifest.webmanifest">
<title>Asistencia QR</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#132b43;font:16px system-ui,sans-serif}
main{max-width:600px;margin:0 auto;padding:16px}h1{text-align:center;font-size:25px;margin:12px 0 20px}
#reader{width:100%;min-height:280px;border:2px solid #b9ccdc;background:#111e2a;border-radius:15px;overflow:hidden}
#reader video{object-fit:cover!important;border-radius:12px}
#status{text-align:center;margin-top:14px;font-size:17px}
#result{margin-top:16px;padding:20px;border-radius:14px;text-align:center;font-size:21px;font-weight:750;white-space:pre-line;min-height:110px;background:#e7eef5}
.ok{background:#d8f8e1!important;color:#125b30}.bad{background:#ffe5e6!important;color:#912123}
small{display:block;text-align:center;color:#526777;margin-top:22px}button{display:block;margin:12px auto;padding:12px;background:#135c90;color:#fff;border:0;border-radius:9px;font:inherit}
#today{margin-top:16px;background:#fff;padding:14px;border-radius:12px}#today h2{font-size:17px;margin:0 0 9px}#todayList{max-height:240px;overflow:auto}.entry{padding:9px 0;border-bottom:1px solid #e7edf3;font-size:14px}.entry span{color:#607285}#configPanel{background:#fff;border-radius:12px;padding:18px;margin-bottom:14px}#configPanel label{display:block;margin-top:10px;font-weight:600}#configPanel input{width:100%;padding:12px;border:1px solid #9cacc0;border-radius:8px;font:inherit;margin-top:4px}#configError{color:#a22}#actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}#actions button{flex:1;min-width:150px}#editConfig{background:#52687a;font-size:14px}#responsibleInfo{text-align:center;font-size:14px;color:#476077;padding:6px}</style></head><body><main><h1>REGISTRO DE ASISTENCIA</h1><section id="configPanel" hidden><h2>Configuración del dispositivo</h2><form id="configForm"><label>Nombre del responsable<input id="chiefName" required maxlength="150" autocomplete="name"></label><label>Número de empleado del jefe<input id="chiefNumber" required maxlength="50"></label><label>Área<input id="chiefArea" required maxlength="150"></label><p id="configError" role="alert"></p><button type="submit">Guardar configuración</button></form></section><div id="scanPanel"><div id="responsibleInfo"></div><div id="reader"></div>
<div id="status" aria-live="polite">Preparando cámara…</div>
<div id="result" aria-live="polite">Acerca tu código QR o código de barras a la cámara.</div>
<section id="today"><h2>Registros de hoy · 00:00–23:59</h2><div id="todayList">Sin registros todavía</div></section><button id="retry" hidden>Reintentar cámara</button><div id="actions"><button id="downloadXlsx">Descargar Excel</button><button id="shareXlsx">Compartir por WhatsApp</button></div><button id="editConfig">Configuración</button></div>
<small>Los registros se conservan en este dispositivo después de descargar o compartir. No borres los datos del navegador.</small></main>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="./app.js?v=11"></script></body></html>
